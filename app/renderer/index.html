<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https:; child-src https:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palad1n</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="paldark" data-bg="animated" data-density="normal" data-motion="full" data-rail="labels">
  <div id="bg" aria-hidden="true"><div class="img"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
  <div id="app">
    <nav id="rail" aria-label="Разделы"></nav>
    <div id="main">
      <header id="top"><h1 id="title"></h1><div id="counters"></div></header>
      <section id="view"></section>
    </div>
  </div>
  <div id="scrim"></div>
  <aside id="drawer" aria-label="Карточка"></aside>
  <aside id="chatdock" aria-label="Чат"></aside>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script src="js/dom.js"></script>
  <script src="js/core.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/lead-ui.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/view-parser.js"></script>
  <script src="js/view-base.js"></script>
  <script src="js/view-queue.js"></script>
  <script src="js/view-inbox.js"></script>
  <script src="js/view-sites.js"></script>
  <script src="js/view-settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
